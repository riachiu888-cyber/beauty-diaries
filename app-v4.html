<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beauty Diaries v4</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fff2f7;color:#342733}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:18px;padding:11px 15px;font-weight:800}.pink{background:#ed2d82;color:#fff}.soft{background:#fff0f5;color:#a72a5b}.danger{background:#ffe5ec;color:#a72a4b}.hide{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(520px,100%);background:white;border-radius:28px;padding:30px;box-shadow:0 16px 45px #bb4a7925}.brand{font-size:12px;letter-spacing:.2em;color:#d75486;font-weight:900}h1{font-size:42px;margin:8px 0}.muted{color:#927b88}label{display:block;font-weight:800;font-size:13px;margin-top:13px}input,select,textarea{width:100%;padding:13px;border:1px solid #ead7df;border-radius:14px;margin-top:6px;background:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.msg{padding:12px;border-radius:14px;margin-top:15px;background:#fff0d6;color:#805b18}.app{min-height:100vh}.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;background:#fffffff0;backdrop-filter:blur(10px);border-bottom:1px solid #f1dce5}.nav{display:flex;gap:7px;overflow:auto;padding:10px 14px;background:linear-gradient(90deg,#ffb3cf,#ff84b1)}.nav button{white-space:nowrap;background:#ffffffb8;color:#9a2f59}.nav button.on{background:#ee287e;color:white}.main{max-width:1200px;margin:auto;padding:18px}.panel{background:#fff;border-radius:22px;padding:20px;margin-bottom:16px;box-shadow:0 10px 30px #c95f8b18}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#fff;border-radius:20px;padding:18px;box-shadow:0 10px 30px #c95f8b18}.stat b{display:block;color:#c82563;font-size:28px;margin-top:5px}.row{display:grid;grid-template-columns:85px 1fr auto;gap:10px;align-items:center;border:1px solid #f2dce5;border-radius:17px;padding:12px;margin:8px 0}.time{background:#44202f;color:#ffdcac;padding:10px;border-radius:12px;text-align:center;font-weight:900}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.box{border:1px solid #f1dce5;border-radius:18px;padding:16px}.price{font-size:25px;font-weight:900;color:#c62463}.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{min-height:70px;border:1px solid #efd9e3;border-radius:12px;padding:6px;background:white}.day.today{outline:2px solid #f06a9f}.day.block{background:#ffedf2}.count{font-size:10px;background:#ffe0ea;color:#a92b5d;padding:3px 5px;border-radius:9px;display:inline-block;margin-top:5px}@media(max-width:760px){.stats{grid-template-columns:1fr 1fr}.grid,.f2{grid-template-columns:1fr}.row{grid-template-columns:70px 1fr}.row>div:last-child{grid-column:2}.top{align-items:flex-start}}@media(max-width:480px){.stats{grid-template-columns:1fr}.card{padding:22px}}</style></head><body><section id="login" class="login"><div class="card"><div class="brand">BEAUTY DIARIES • LOGIN V4</div><h1>Owner Login</h1><p class="muted">Stable direct login — no redirect.</p><label>Email<input id="email" type="email" value="riachiu888@gmail.com"></label><label>Password<input id="password" type="password"></label><div class="actions"><button id="signIn" class="pink">Sign In</button><button id="forgot" class="soft">Forgot Password?</button></div><div id="loginMsg" class="msg hide"></div></div></section><div id="app" class="app hide"><div class="top"><div><div class="brand">BEAUTY DIARIES</div><b id="title">Home</b></div><div class="actions"><span id="sync" class="muted">Cloud</span><button id="logout" class="danger">Log out</button></div></div><div id="nav" class="nav"></div><main class="main"><section id="home" class="page"><div class="stats"><div class="stat">Today<b id="sToday">0</b></div><div class="stat">Revenue<b id="sRev">$0</b></div><div class="stat">Customers<b id="sCust">0</b></div><div class="stat">Staff<b id="sStaff">0</b></div></div><div class="panel"><h3>Recent Appointments</h3><div id="recent"></div></div></section><section id="calendar" class="page hide"><div class="panel"><div class="actions"><button class="soft" onclick="moveMonth(-1)">‹ Previous</button><button class="soft" onclick="moveMonth(1)">Next ›</button></div><h3 id="calTitle"></h3><div id="cal" class="calendar"></div></div></section><section id="appointments" class="page hide"><div class="panel"><h3>Add Appointment</h3><form id="apptForm"><div class="f2"><label>Customer<input name="name" required></label><label>WhatsApp<input name="phone"></label><label>Date<input name="date" type="date" required></label><label>Time<select name="time"><option>11:00</option><option>13:00</option><option>15:00</option><option>17:00</option><option>19:00</option></select></label><label>Type<select name="type"><option>Full Set</option><option>Touch-Up</option></select></label><label>Service<select name="service" id="apptService"></select></label><label>Price<input name="price" id="apptPrice" type="number"></label><label>Staff<select name="staff" id="apptStaff"></select></label><label>Status<select name="status"><option>Booked</option><option>Completed</option><option>Cancelled</option></select></label><label>Deposit<select name="deposit"><option>Unpaid</option><option>Paid</option><option>Waived</option></select></label></div><button class="pink">Save Appointment</button></form></div><div class="panel"><h3>Appointments</h3><div id="apptList"></div></div></section><section id="customers" class="page hide"><div class="panel"><h3>Add Customer</h3><form id="custForm"><div class="f2"><label>Name<input name="name" required></label><label>WhatsApp<input name="phone"></label></div><label>Notes<textarea name="notes"></textarea></label><button class="pink">Add Customer</button></form></div><div class="panel"><h3>Customers</h3><div id="custList"></div></div></section><section id="services" class="page hide"><div class="panel"><h3>Add Service</h3><form id="svcForm"><div class="f2"><label>Name<input name="name" required></label><label>Price<input name="price" type="number" required></label></div><button class="pink">Add Service</button></form></div><div id="svcList" class="grid"></div></section><section id="staff" class="page hide"><div class="panel"><h3>Add Staff</h3><form id="staffForm"><div class="f2"><label>Name<input name="name" required></label><label>Role<input name="role" value="Lash Artist"></label></div><button class="pink">Add Staff</button></form></div><div id="staffList" class="grid"></div></section><section id="unavailable" class="page hide"><div class="panel"><h3>Block Date</h3><form id="blockForm"><div class="f2"><label>Date<input name="date" type="date" required></label><label>Reason<input name="reason"></label></div><button class="pink">Block Date</button></form><div id="blockList"></div></div></section></main></div><script>const BASE='https://efsmkwomyiebbjtgsxjo.supabase.co',KEY='sb_publishable_KgUjGzGPpRBZaOFstNi7_g_m5uESMSi',STORE='bd_v4_session';let session=null,user=null,view=new Date();let data={services:[{id:1,name:'Classic Lash',price:88},{id:2,name:'Manga Lash',price:138}],staff:[{id:1,name:'Owner',role:'Senior Lash Artist'}],customers:[],appointments:[],expenses:[],members:[],unavailable:[],settings:{deposit:30}};const $=x=>document.getElementById(x),cash=n=>new Intl.NumberFormat('en-SG',{style:'currency',currency:'SGD',maximumFractionDigits:0}).format(+n||0),uid=()=>Date.now()+Math.floor(Math.random()*999),today=()=>new Date().toISOString().slice(0,10),pages=[['home','🏠 Home'],['calendar','🗓️ Calendar'],['appointments','📅 Appointments'],['customers','💗 Customers'],['services','✨ Services'],['staff','👩🏻‍🎨 Staff'],['unavailable','🚫 Unavailable']];function headers(){return{'apikey':KEY,'Authorization':'Bearer '+session.access_token,'Content-Type':'application/json'}}function msg(t,bad=false){loginMsg.classList.remove('hide');loginMsg.textContent=t;loginMsg.style.background=bad?'#ffe4ea':'#e9f8ee';loginMsg.style.color=bad?'#a52849':'#267848'}async function loginNow(){msg('Signing in…');try{let r=await fetch(BASE+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':KEY,'Content-Type':'application/json'},body:JSON.stringify({email:email.value.trim(),password:password.value})});let d=await r.json();if(!r.ok)return msg(d.error_description||d.msg||d.message||'Login failed',true);session=d;user=d.user;localStorage.setItem(STORE,JSON.stringify(d));msg('Login successful. Opening dashboard…');await openApp()}catch(e){msg('Connection error: '+e.message,true)}}async function restore(){try{let s=JSON.parse(localStorage.getItem(STORE)||'null');if(!s?.access_token)return;let r=await fetch(BASE+'/auth/v1/user',{headers:{'apikey':KEY,'Authorization':'Bearer '+s.access_token}});if(!r.ok){localStorage.removeItem(STORE);return}session=s;user=await r.json();await openApp()}catch(e){localStorage.removeItem(STORE)}}async function openApp(){login.classList.add('hide');app.classList.remove('hide');buildNav();await loadData();render()}async function loadData(){sync.textContent='Loading…';let r=await fetch(BASE+'/rest/v1/app_state?select=data&owner_id=eq.'+encodeURIComponent(user.id),{headers:headers()});if(r.ok){let a=await r.json();if(a[0]?.data)data={...data,...a[0].data};else await saveData()}sync.textContent='Cloud synced'}async function saveData(){sync.textContent='Saving…';let r=await fetch(BASE+'/rest/v1/app_state?on_conflict=owner_id',{method:'POST',headers:{...headers(),'Prefer':'resolution=merge-duplicates'},body:JSON.stringify({owner_id:user.id,data,updated_at:new Date().toISOString()})});sync.textContent=r.ok?'Saved':'Save error';render()}function buildNav(){nav.innerHTML=pages.map(p=>`<button data-p="${p[0]}" onclick="go('${p[0]}')">${p[1]}</button>`).join('')}function go(p){document.querySelectorAll('.page').forEach(x=>x.classList.add('hide'));$(p).classList.remove('hide');document.querySelectorAll('[data-p]').forEach(x=>x.classList.toggle('on',x.dataset.p===p));title.textContent=pages.find(x=>x[0]===p)[1].replace(/^.. /,'');if(p==='calendar')renderCal()}function render(){apptService.innerHTML=data.services.map(s=>`<option>${s.name}</option>`).join('');apptStaff.innerHTML='<option value="">Unassigned</option>'+data.staff.map(s=>`<option>${s.name}</option>`).join('');svcList.innerHTML=data.services.map(s=>`<div class="box"><b>${s.name}</b><div class="price">${cash(s.price)}</div><button class="danger" onclick="data.services=data.services.filter(x=>x.id!=${s.id});saveData()">Delete</button></div>`).join('');staffList.innerHTML=data.staff.map(s=>`<div class="box"><b>${s.name}</b><p>${s.role||''}</p><button class="danger" onclick="data.staff=data.staff.filter(x=>x.id!=${s.id});saveData()">Delete</button></div>`).join('');custList.innerHTML=data.customers.map(c=>`<div class="row"><div class="time">${c.visits||0}x</div><div><b>${c.name}</b><div class="muted">${c.phone||''}</div><div>${c.notes||''}</div></div><button class="danger" onclick="data.customers=data.customers.filter(x=>x.id!=${c.id});saveData()">Delete</button></div>`).join('')||'<p class="muted">No customers.</p>';let a=[...data.appointments].sort((x,y)=>(y.date+y.time).localeCompare(x.date+x.time));apptList.innerHTML=a.map(apptRow).join('')||'<p>No appointments.</p>';recent.innerHTML=a.slice(0,4).map(apptRow).join('')||'<p>No appointments.</p>';blockList.innerHTML=data.unavailable.map((u,i)=>`<div class="row"><div class="time">${u.date.slice(5)}</div><div><b>${u.date}</b><div>${u.reason||'Unavailable'}</div></div><button class="danger" onclick="data.unavailable.splice(${i},1);saveData()">Remove</button></div>`).join('')||'<p>No blocked dates.</p>';let ym=today().slice(0,7),rev=data.appointments.filter(a=>a.date.startsWith(ym)&&a.status==='Completed').reduce((s,a)=>s+(+a.price||0),0);sToday.textContent=data.appointments.filter(a=>a.date===today()).length;sRev.textContent=cash(rev);sCust.textContent=data.customers.length;sStaff.textContent=data.staff.length;renderCal()}function apptRow(a){return`<div class="row"><div class="time">${a.time}</div><div><b>${a.name}</b><div class="muted">${a.type||'Full Set'} · ${a.service} · ${a.date}</div><div>${cash(a.price)} · Deposit ${a.deposit||'Unpaid'}</div></div><button class="danger" onclick="data.appointments=data.appointments.filter(x=>x.id!=${a.id});saveData()">Delete</button></div>`}function renderCal(){if(!cal)return;let y=view.getFullYear(),m=view.getMonth(),start=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate();calTitle.textContent=view.toLocaleString('en-SG',{month:'long',year:'numeric'});let h=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<b style="text-align:center;font-size:11px">${d}</b>`).join('');for(let i=0;i<42;i++){let d=i-start+1;if(d<1||d>days){h+='<div class="day"></div>';continue}let x=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,n=data.appointments.filter(a=>a.date===x&&a.status!=='Cancelled').length,b=data.unavailable.some(u=>u.date===x);h+=`<div class="day ${x===today()?'today ':''}${b?'block':''}"><b>${d}</b>${n?`<div class="count">${n} appt</div>`:''}${b?'<div class="muted">Unavailable</div>':''}</div>`}cal.innerHTML=h}function moveMonth(n){view=new Date(view.getFullYear(),view.getMonth()+n,1);renderCal()}signIn.onclick=loginNow;password.addEventListener('keydown',e=>{if(e.key==='Enter')loginNow()});forgot.onclick=async()=>{msg('Sending reset email…');let r=await fetch(BASE+'/auth/v1/recover?redirect_to='+encodeURIComponent('https://riachiu888-cyber.github.io/beauty-diaries/reset.html'),{method:'POST',headers:{'apikey':KEY,'Content-Type':'application/json'},body:JSON.stringify({email:email.value.trim()})});msg(r.ok?'Reset email sent. Check Gmail and Spam.':'Could not send reset email',!r.ok)};logout.onclick=()=>{localStorage.removeItem(STORE);location.reload()};apptService.onchange=()=>{let s=data.services.find(x=>x.name===apptService.value);apptPrice.value=s?.price||0};apptForm.onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),a={id:uid(),name:f.get('name'),phone:f.get('phone'),date:f.get('date'),time:f.get('time'),type:f.get('type'),service:f.get('service'),price:+f.get('price')||0,staff:f.get('staff'),status:f.get('status'),deposit:f.get('deposit')};data.appointments.push(a);if(!data.customers.some(c=>c.phone&&c.phone===a.phone))data.customers.push({id:uid(),name:a.name,phone:a.phone,visits:1,notes:''});e.target.reset();saveData()};custForm.onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);data.customers.push({id:uid(),name:f.get('name'),phone:f.get('phone'),visits:0,notes:f.get('notes')});e.target.reset();saveData()};svcForm.onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);data.services.push({id:uid(),name:f.get('name'),price:+f.get('price')});e.target.reset();saveData()};staffForm.onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);data.staff.push({id:uid(),name:f.get('name'),role:f.get('role')});e.target.reset();saveData()};blockForm.onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);data.unavailable.push({date:f.get('date'),reason:f.get('reason')});e.target.reset();saveData()};restore();</script></body></html>
