<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate"><title>Beauty Diaries Owner Access</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(#fff8fb,#ffe7f1);color:#342833;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(520px,100%);background:#fff;border-radius:28px;padding:30px;box-shadow:0 16px 45px #bb4a7925}.brand{letter-spacing:.2em;font-size:12px;font-weight:900;color:#d75486}h1{font-size:38px;margin:8px 0 6px}.muted{color:#947f8a}label{display:block;font-size:13px;font-weight:800;margin-top:14px}input{width:100%;padding:13px;border:1px solid #ead7df;border-radius:14px;margin-top:6px;font-size:16px}button{border:0;border-radius:999px;padding:12px 17px;font-weight:800;cursor:pointer;margin-top:14px}.primary{background:#ed267f;color:white}.soft{background:#fff0f5;color:#a52b5b}.msg{margin-top:16px;padding:12px;border-radius:14px;background:#fff0d7;color:#7d5b1c;display:none}.ok{background:#e8f8ed;color:#267747}.bad{background:#ffe7eb;color:#a32b47}</style></head><body><div class="card"><div class="brand">BEAUTY DIARIES</div><h1>Owner Access</h1><p class="muted">Sign in to open your Beauty Diaries dashboard.</p><label>Email<input id="email" type="email" value="riachiu888@gmail.com"></label><label>Password<input id="password" type="password" minlength="6"></label><button id="loginBtn" class="primary">Sign In</button><button id="resetBtn" class="soft">Forgot Password?</button><div id="msg" class="msg"></div></div><script>const URL='https://efsmkwomyiebbjtgsxjo.supabase.co',KEY='sb_publishable_KgUjGzGPpRBZaOFstNi7_g_m5uESMSi',m=document.getElementById('msg');function show(t,c){m.style.display='block';m.className='msg '+(c||'');m.textContent=t}async function login(){show('Checking your login…');try{let r=await fetch(URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':KEY,'Content-Type':'application/json'},body:JSON.stringify({email:email.value.trim(),password:password.value})}),d=await r.json();if(!r.ok){show(d.error_description||d.msg||d.message||'Login failed','bad');return}try{localStorage.setItem('sb-efsmkwomyiebbjtgsxjo-auth-token',JSON.stringify(d));localStorage.setItem('bd_login_handoff',JSON.stringify({access_token:d.access_token,refresh_token:d.refresh_token,user:d.user||null}))}catch(e){}show('Login successful. Opening Beauty Diaries…','ok');const hash=new URLSearchParams({access_token:d.access_token,refresh_token:d.refresh_token,expires_in:String(d.expires_in||3600),token_type:d.token_type||'bearer',type:'magiclink'}).toString();setTimeout(()=>location.replace('./?v=loginfix3#'+hash),250)}catch(e){show('Could not connect: '+e.message,'bad')}}async function reset(){show('Sending password reset email…');try{let r=await fetch(URL+'/auth/v1/recover?redirect_to='+encodeURIComponent('https://riachiu888-cyber.github.io/beauty-diaries/?reset=1'),{method:'POST',headers:{'apikey':KEY,'Content-Type':'application/json'},body:JSON.stringify({email:email.value.trim()})}),d={};try{d=await r.json()}catch{};show(r.ok?'Reset email sent. Check Gmail and Spam.':(d.msg||d.message||'Could not send reset email'),r.ok?'ok':'bad')}catch(e){show(e.message,'bad')}}loginBtn.onclick=login;resetBtn.onclick=reset;password.addEventListener('keydown',e=>{if(e.key==='Enter')login()});</script></body></html>
