<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beauty Diaries Password Reset</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(#fff7fa,#ffe7f1);min-height:100vh;display:grid;place-items:center;color:#332732}.card{width:min(440px,calc(100% - 32px));background:#fff;border-radius:28px;padding:30px;box-shadow:0 15px 45px rgba(175,65,112,.16)}.brand{font-size:12px;letter-spacing:.22em;font-weight:900;color:#d65284}h1{font-size:34px;margin:8px 0 10px}p{color:#8f7b86}label{display:block;font-size:13px;font-weight:800;margin:12px 0 5px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ead6df;border-radius:12px;font:inherit}button{border:0;border-radius:999px;padding:12px 16px;font:inherit;font-weight:800;cursor:pointer;margin-top:12px}.primary{background:#ee2b80;color:#fff}.soft{background:#fff0f5;color:#a52e5e}.msg{display:none;margin-top:14px;padding:11px 13px;border-radius:12px;background:#fff1d6;color:#7e5a18}.row{display:flex;gap:8px;flex-wrap:wrap}</style></head><body><div class="card"><div class="brand">BEAUTY DIARIES</div><h1 id="title">Reset Password</h1><p id="desc">Enter your owner email and we will send you a secure password-reset link.</p><div id="requestBox"><label>Email</label><input id="email" type="email" value="riachiu888@gmail.com"><div class="row"><button id="send" class="primary">Send Reset Email</button><button class="soft" onclick="location.href='./'">Back to Login</button></div></div><div id="changeBox" style="display:none"><label>New password</label><input id="newPass" type="password" minlength="6"><label>Confirm new password</label><input id="confirmPass" type="password" minlength="6"><button id="update" class="primary">Update Password</button></div><div id="msg" class="msg"></div></div><script>const sb=supabase.createClient('https://efsmkwomyiebbjtgsxjo.supabase.co','sb_publishable_KgUjGzGPpRBZaOFstNi7_g_m5uESMSi');const msg=document.getElementById('msg');function show(t,bad=false){msg.style.display='block';msg.textContent=t;msg.style.background=bad?'#ffe4e9':'#fff1d6';msg.style.color=bad?'#a62b48':'#7e5a18'}document.getElementById('send').onclick=async()=>{const em=document.getElementById('email').value.trim();if(!em)return show('Please enter your email.',true);show('Sending reset email…');const {error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:'https://riachiu888-cyber.github.io/beauty-diaries/reset.html'});if(error)return show(error.message,true);show('Reset email sent. Please check your inbox and spam folder, then open the link in that email.')};function recoveryMode(){document.getElementById('requestBox').style.display='none';document.getElementById('changeBox').style.display='block';document.getElementById('title').textContent='Set New Password';document.getElementById('desc').textContent='Enter your new Beauty Diaries password below.'}sb.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY')recoveryMode()});sb.auth.getSession().then(({data})=>{if(data.session&&location.hash)recoveryMode()});document.getElementById('update').onclick=async()=>{const a=document.getElementById('newPass').value,b=document.getElementById('confirmPass').value;if(a.length<6)return show('Password must be at least 6 characters.',true);if(a!==b)return show('Passwords do not match.',true);show('Updating password…');const {error}=await sb.auth.updateUser({password:a});if(error)return show(error.message,true);show('Password updated successfully. You can now sign in with your new password.');setTimeout(async()=>{await sb.auth.signOut();location.href='./'},1400)};</script></body></html>
